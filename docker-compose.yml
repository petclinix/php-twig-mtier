services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      # Local dev/test needs PHPUnit + tests/ — the prod stage (the Dockerfile's
      # default target) deliberately excludes both. See docker/php/Dockerfile.
      target: testing
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: petclinix
      DB_USER: petclinix
      DB_PASSWORD: petclinix
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: petclinix
      MARIADB_USER: petclinix
      MARIADB_PASSWORD: petclinix
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    ports:
      - "3306:3306"

volumes:
  db_data:
  vendor:
