# Project identification
sonar.projectKey=petclinix_php-twig-mtier
sonar.projectName=PHP Twig m-Tier
sonar.projectVersion=1.0

# Encoding
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=src
sonar.tests=tests

# vendor is third-party/generated, coverage/ is our own generated report output
sonar.exclusions=vendor/**,coverage/**
sonar.test.exclusions=vendor/**

# PHP coverage report (PHPUnit's Clover XML)
sonar.php.coverage.reportPaths=coverage/clover.xml
